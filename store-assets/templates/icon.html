<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Extension Icon</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
    }

    body {
      display: grid;
      place-items: center;
    }

    .tile {
      position: relative;
      width: 75vmin;
      height: 75vmin;
      border-radius: 24%;
      background:
        radial-gradient(circle at 18% 18%, rgba(255, 255, 255, 0.32), transparent 34%),
        linear-gradient(135deg, #0f766e 0%, #15958a 52%, #f0a54e 100%);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.2),
        0 18px 42px rgba(11, 93, 87, 0.34);
    }

    .tile::before {
      content: "";
      position: absolute;
      inset: 17%;
      border-radius: 25%;
      border: max(2px, 4.5vmin) solid rgba(255, 255, 255, 0.96);
      box-sizing: border-box;
      background: rgba(255, 255, 255, 0.06);
    }

    .field {
      position: absolute;
      left: 31%;
      top: 34%;
      width: 18%;
      height: 32%;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.94);
      box-shadow: 0 0 0 max(1px, 1.8vmin) rgba(15, 118, 110, 0.18);
    }

    .field::after {
      content: "";
      position: absolute;
      right: -50%;
      top: 18%;
      width: 84%;
      height: 18%;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.96);
      box-shadow: 0 34% 0 0 rgba(255, 255, 255, 0.82);
    }

    .arrow {
      position: absolute;
      right: 26%;
      bottom: 22%;
      width: 26%;
      height: 26%;
      border-radius: 50%;
      background: rgba(32, 24, 19, 0.18);
      backdrop-filter: blur(2px);
    }

    .arrow::before,
    .arrow::after {
      content: "";
      position: absolute;
      background: #fff;
      border-radius: 999px;
      transform-origin: center center;
    }

    .arrow::before {
      left: 26%;
      top: 44%;
      width: 48%;
      height: 12%;
    }

    .arrow::after {
      right: 18%;
      top: 26%;
      width: 18%;
      height: 18%;
      border-top: max(2px, 2.4vmin) solid #fff;
      border-right: max(2px, 2.4vmin) solid #fff;
      background: transparent;
      transform: rotate(45deg);
    }
  </style>
</head>
<body>
  <div class="tile" aria-hidden="true">
    <div class="field"></div>
    <div class="arrow"></div>
  </div>
</body>
</html>
