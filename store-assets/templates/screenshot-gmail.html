<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gmail Key Remap Screenshot</title>
  <style>
    :root {
      --bg: #eef2f7;
      --mail: #ffffff;
      --line: #d8dee8;
      --text: #1f2937;
      --muted: #677489;
      --accent: #0f766e;
      --accent-soft: rgba(15, 118, 110, 0.12);
      --warm: #f6efe5;
      --shadow: 0 24px 48px rgba(31, 41, 55, 0.12);
      font-family: "Segoe UI Variable", "Segoe UI", "Apple SD Gothic Neo", sans-serif;
    }

    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background:
        radial-gradient(circle at top left, rgba(15, 118, 110, 0.12), transparent 28%),
        linear-gradient(180deg, #f8fbff 0%, var(--bg) 100%);
      color: var(--text);
    }

    .scene {
      width: 100%;
      height: 100%;
      padding: 34px;
      display: grid;
      grid-template-columns: 1.4fr 0.8fr;
      gap: 24px;
    }

    .mail {
      background: var(--mail);
      border-radius: 28px;
      box-shadow: var(--shadow);
      overflow: hidden;
      border: 1px solid rgba(31, 41, 55, 0.08);
    }

    .topbar {
      height: 64px;
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 0 22px;
      border-bottom: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.92);
    }

    .logo {
      width: 44px;
      height: 32px;
      border-radius: 10px;
      background: linear-gradient(135deg, #ea4335, #fbbc05);
    }

    .search {
      flex: 1;
      height: 42px;
      border-radius: 999px;
      background: #f5f7fb;
      color: var(--muted);
      display: flex;
      align-items: center;
      padding: 0 18px;
    }

    .body {
      display: grid;
      grid-template-columns: 220px 1fr;
      height: calc(100% - 64px);
    }

    .sidebar {
      padding: 20px;
      border-right: 1px solid var(--line);
      background: #fbfcfe;
    }

    .compose {
      width: 140px;
      height: 52px;
      border-radius: 18px;
      background: #c2e7ff;
      margin-bottom: 18px;
    }

    .nav-line {
      height: 14px;
      border-radius: 999px;
      background: #e6ebf2;
      margin-bottom: 14px;
    }

    .list {
      padding: 16px 0;
    }

    .row {
      display: grid;
      grid-template-columns: 42px 160px 1fr 80px;
      align-items: center;
      gap: 14px;
      padding: 16px 22px;
      border-bottom: 1px solid #eef2f7;
    }

    .checkbox {
      width: 20px;
      height: 20px;
      border-radius: 6px;
      border: 2px solid #d0d8e4;
    }

    .chip, .subject, .time {
      height: 14px;
      border-radius: 999px;
      background: #e9eef5;
    }

    .chip { width: 100px; }
    .subject { width: 90%; }
    .time { width: 46px; justify-self: end; }

    .card {
      align-self: center;
      padding: 24px;
      border-radius: 28px;
      background:
        radial-gradient(circle at top right, rgba(15, 118, 110, 0.14), transparent 24%),
        linear-gradient(180deg, #fffaf3 0%, var(--warm) 100%);
      box-shadow: 0 26px 52px rgba(72, 52, 31, 0.16);
      border: 1px solid rgba(82, 59, 38, 0.1);
    }

    .eyebrow {
      margin: 0 0 8px;
      color: #0b5d57;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    h1, h2, p { margin: 0; }

    h1 {
      margin-bottom: 8px;
      font-size: 32px;
      line-height: 1.05;
    }

    .muted {
      color: #6f5c4c;
    }

    .rule {
      margin-top: 18px;
      padding: 18px;
      border-radius: 22px;
      background: rgba(255, 255, 255, 0.82);
      border: 1px solid rgba(82, 59, 38, 0.12);
    }

    .keys {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 16px 0 10px;
    }

    .keycap {
      min-width: 74px;
      padding: 14px 16px;
      border-radius: 18px;
      background: #fff;
      border: 1px solid rgba(82, 59, 38, 0.12);
      box-shadow: inset 0 -4px 0 rgba(15, 118, 110, 0.08);
      font-weight: 800;
      text-align: center;
    }

    .arrow {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: var(--accent-soft);
      color: var(--accent);
      display: grid;
      place-items: center;
      font-size: 22px;
      font-weight: 800;
    }

    .status {
      margin-top: 16px;
      padding: 14px 16px;
      border-radius: 18px;
      background: rgba(15, 118, 110, 0.12);
      color: #0b5d57;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <div class="scene">
    <section class="mail">
      <div class="topbar">
        <div class="logo"></div>
        <div class="search">mail.google.com</div>
      </div>
      <div class="body">
        <aside class="sidebar">
          <div class="compose"></div>
          <div class="nav-line"></div>
          <div class="nav-line" style="width:74%;"></div>
          <div class="nav-line" style="width:82%;"></div>
          <div class="nav-line" style="width:58%;"></div>
        </aside>
        <div class="list">
          <div class="row"><div class="checkbox"></div><div class="chip"></div><div class="subject"></div><div class="time"></div></div>
          <div class="row"><div class="checkbox"></div><div class="chip"></div><div class="subject"></div><div class="time"></div></div>
          <div class="row"><div class="checkbox"></div><div class="chip"></div><div class="subject"></div><div class="time"></div></div>
          <div class="row"><div class="checkbox"></div><div class="chip"></div><div class="subject"></div><div class="time"></div></div>
          <div class="row"><div class="checkbox"></div><div class="chip"></div><div class="subject"></div><div class="time"></div></div>
          <div class="row"><div class="checkbox"></div><div class="chip"></div><div class="subject"></div><div class="time"></div></div>
        </div>
      </div>
    </section>

    <aside class="card">
      <p class="eyebrow">URL-based Key Remap</p>
      <h1>Gmail 단축키를 익숙한 키로 맞춥니다</h1>
      <p class="muted">사이트별로 원하는 키를 다시 매핑해서 웹앱 단축키를 더 자연스럽게 사용할 수 있습니다.</p>

      <div class="rule">
        <p class="eyebrow">Active Rule</p>
        <h2>Gmail Delete -&gt; Shift+3</h2>
        <div class="keys">
          <div class="keycap">Delete</div>
          <div class="arrow">→</div>
          <div class="keycap">Shift+3</div>
        </div>
        <p class="muted">URL: *://mail.google.com/*</p>
      </div>

      <div class="status">Delete 입력을 감지하면 Gmail의 # 단축키로 다시 전달합니다.</div>
    </aside>
  </div>
</body>
</html>
